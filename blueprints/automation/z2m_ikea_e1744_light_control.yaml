blueprint:
  name: Zigbee2MQTT IKEA E1744 조명 제어
  description: >-
    IKEA SYMFONISK 1세대 회전 노브(E1744)로 밝기, 색온도, 색상 또는 채도를 조절합니다.
    클릭 1·2·3회 동작은 직접 지정합니다.
    [설정 안내](https://github.com/kkqq9320/homeassistant/blob/main/blueprints/automation/z2m_ikea_e1744_light_control/README.md)
  domain: automation
  source_url: https://github.com/kkqq9320/homeassistant/blob/main/blueprints/automation/z2m_ikea_e1744_light_control.yaml
  homeassistant:
    min_version: "2025.4.0"
  input:
    connection:
      name: 연결
      input:
        base_topic:
          name: Zigbee2MQTT 기본 topic
          default: zigbee2mqtt
          selector:
            text: {}
        knob:
          name: Zigbee2MQTT 노브 이름
          description: Zigbee2MQTT의 friendly_name을 공백과 대소문자까지 그대로 입력합니다.
          selector:
            text: {}
        target_light:
          name: 대상 조명
          description: 여러 조명을 조절하려면 하나의 조명 그룹을 선택합니다.
          selector:
            entity:
              filter:
                - domain: light
              multiple: false
    rotation:
      name: 회전 기능
      input:
        rotation_mode:
          name: 조절할 기능
          default: brightness
          selector:
            select:
              options:
                - value: brightness
                  label: 조명 밝기
                - value: color_temperature
                  label: 조명 색온도
                - value: light_hue
                  label: Light Hue — 색상
                - value: light_saturation
                  label: Light Saturation — 채도
        restore_brightness:
          name: 꺼진 조명을 켤 때 밝기 복원
          description: >-
            밝기 기능에서 오른쪽으로 돌릴 때 적용합니다. 켜면 조명이 복원한 밝기부터
            조절하고, 끄면 0%를 기준으로 밝아집니다. 색온도·색상·채도는 복원 밝기를 유지합니다.
          default: false
          selector:
            boolean: {}
    tuning:
      name: 조절량과 반복
      description: 조절량은 물리적인 한 칸이 아닌 반복 한 번의 변화량입니다.
      collapsed: true
      input:
        brightness_step_pct:
          name: 밝기 변화량
          default: 2
          selector:
            number: {min: 1, max: 100, step: 1, unit_of_measurement: "%p", mode: box}
        color_temp_step_kelvin:
          name: 색온도 변화량
          default: 100
          selector:
            number: {min: 1, max: 10000, step: 1, unit_of_measurement: K, mode: box}
        hue_step_percent:
          name: 색상환 이동 비율
          description: 2%는 색상환에서 7.2°입니다.
          default: 2
          selector:
            number: {min: 1, max: 100, step: 1, unit_of_measurement: "%", mode: box}
        saturation_step_pct:
          name: 채도 변화량
          default: 2
          selector:
            number: {min: 1, max: 100, step: 1, unit_of_measurement: "%p", mode: box}
        repeat_interval_ms:
          name: 반복 간격
          description: 명령 처리가 끝난 뒤 다음 조절까지 기다리는 시간입니다.
          default: 200
          selector:
            number: {min: 100, max: 2000, step: 10, unit_of_measurement: ms, mode: box}
        max_rotation_seconds:
          name: 최대 반복 시간
          description: 정지 신호가 누락되어도 이 시간이 지나면 새 반복을 시작하지 않습니다.
          default: 10
          selector:
            number: {min: 1, max: 30, step: 1, unit_of_measurement: s, mode: box}
    clicks:
      name: 클릭 동작
      input:
        action_click_short:
          name: 한 번 클릭
          default: []
          selector:
            action: {}
        action_click_double:
          name: 두 번 클릭
          default: []
          selector:
            action: {}
        action_click_triple:
          name: 세 번 클릭
          default: []
          selector:
            action: {}

mode: restart
trigger_variables:
  base_topic: !input base_topic
  knob: !input knob
triggers:
  - trigger: mqtt
    topic: "{{ base_topic }}/{{ knob }}"
    payload: accepted
    value_template: >-
      {{ 'accepted' if value_json is mapping and value_json.action is defined
         and value_json.action is string and value_json.action in
         ['toggle', 'brightness_step_up', 'brightness_step_down',
          'brightness_move_up', 'brightness_move_down', 'brightness_stop']
         else 'ignored' }}
actions:
  - variables:
      knob_action: "{{ trigger.payload_json.action }}"
  - choose:
      - conditions: "{{ knob_action == 'toggle' }}"
        sequence: !input action_click_short
      - conditions: "{{ knob_action == 'brightness_step_up' }}"
        sequence: !input action_click_double
      - conditions: "{{ knob_action == 'brightness_step_down' }}"
        sequence: !input action_click_triple
  - if: "{{ knob_action not in ['brightness_move_up', 'brightness_move_down'] }}"
    then:
      - stop: 클릭 또는 정지 동작 종료
  - variables:
      target_light: !input target_light
      rotation_mode: !input rotation_mode
      brightness_step_pct: !input brightness_step_pct
      color_temp_step_kelvin: !input color_temp_step_kelvin
      hue_step_percent: !input hue_step_percent
      saturation_step_pct: !input saturation_step_pct
      repeat_interval_ms: !input repeat_interval_ms
      max_rotation_seconds: !input max_rotation_seconds
      direction: "{{ 1 if knob_action == 'brightness_move_up' else -1 }}"
      deadline: "{{ as_timestamp(now()) + max_rotation_seconds }}"
      supported_modes: "{{ state_attr(target_light, 'supported_color_modes') or [] }}"
      supported: >-
        {{ supported_modes is sequence and supported_modes is not string and
           ((rotation_mode == 'brightness' and
             supported_modes | select('in', ['brightness', 'color_temp', 'hs', 'xy', 'rgb', 'rgbw', 'rgbww', 'white']) | list | count > 0)
            or (rotation_mode == 'color_temperature' and 'color_temp' in supported_modes)
            or (rotation_mode in ['light_hue', 'light_saturation'] and
                supported_modes | select('in', ['hs', 'xy', 'rgb', 'rgbw', 'rgbww']) | list | count > 0)) }}
  - if: "{{ not supported }}"
    then:
      - stop: 선택한 조명 기능을 지원하지 않음
  - if: "{{ not is_state(target_light, 'on') }}"
    then:
      - stop: 켜진 조명 상태가 아님
  - variables:
      brightness: "{{ state_attr(target_light, 'brightness') }}"
      kelvin: "{{ state_attr(target_light, 'color_temp_kelvin') }}"
      min_kelvin: "{{ state_attr(target_light, 'min_color_temp_kelvin') }}"
      max_kelvin: "{{ state_attr(target_light, 'max_color_temp_kelvin') }}"
      hs: "{{ state_attr(target_light, 'hs_color') }}"
      held_hue: >-
        {{ hs[0] if hs is sequence and hs is not string and hs is not mapping and hs | count > 0 else none }}
      held_saturation: >-
        {{ hs[1] if hs is sequence and hs is not string and hs is not mapping and hs | count > 1 else none }}
      valid_value: >-
        {% if rotation_mode == 'brightness' %}
          {{ brightness is number and brightness is not boolean and is_number(brightness)
             and 0 <= brightness <= 255 }}
        {% elif rotation_mode == 'color_temperature' %}
          {{ kelvin is number and kelvin is not boolean and is_number(kelvin) and kelvin > 0
             and min_kelvin is number and min_kelvin is not boolean and is_number(min_kelvin)
             and max_kelvin is number and max_kelvin is not boolean and is_number(max_kelvin)
             and 0 < min_kelvin <= max_kelvin }}
        {% else %}
          {{ held_hue is number and held_hue is not boolean and is_number(held_hue) and 0 <= held_hue <= 360
             and held_saturation is not boolean
             and (held_saturation is not number or (is_number(held_saturation) and 0 <= held_saturation <= 100)) }}
        {% endif %}
  - if: "{{ not valid_value }}"
    then:
      - stop: 조절에 필요한 조명 속성이 유효하지 않음
  - variables:
      held_hue: "{{ (held_hue % 360) | round(3) if held_hue is number else 0 }}"
      held_saturation: "{{ held_saturation | round(3) if held_saturation is number else 50 }}"
      target_value: >-
        {% if rotation_mode == 'brightness' %}{{ (brightness / 255 * 100) | round(3) }}
        {% elif rotation_mode == 'color_temperature' %}{{ kelvin }}
        {% elif rotation_mode == 'light_hue' %}{{ held_hue }}
        {% else %}{{ held_saturation }}{% endif %}
  - repeat:
      while: "{{ is_state(target_light, 'on') and as_timestamp(now()) < deadline }}"
      sequence:
        - variables:
            previous_value: "{{ target_value }}"
            target_value: >-
              {% if rotation_mode == 'brightness' %}
                {{ [[target_value + direction * brightness_step_pct, 1] | max, 100] | min | round(3) }}
              {% elif rotation_mode == 'color_temperature' %}
                {{ [[target_value + direction * color_temp_step_kelvin, min_kelvin] | max, max_kelvin] | min | round(0) }}
              {% elif rotation_mode == 'light_hue' %}
                {{ ((target_value + direction * hue_step_percent * 3.6) % 360) | round(3) }}
              {% else %}
                {{ [[target_value + direction * saturation_step_pct, 0] | max, 100] | min | round(3) }}
              {% endif %}
        - if: "{{ target_value != previous_value }}"
          then:
            - choose:
                - conditions: "{{ rotation_mode == 'brightness' }}"
                  sequence:
                    - action: light.turn_on
                      target:
                        entity_id: "{{ target_light }}"
                      data:
                        brightness_pct: "{{ target_value }}"
                - conditions: "{{ rotation_mode == 'color_temperature' }}"
                  sequence:
                    - action: light.turn_on
                      target:
                        entity_id: "{{ target_light }}"
                      data:
                        color_temp_kelvin: "{{ target_value }}"
              default:
                - action: light.turn_on
                  target:
                    entity_id: "{{ target_light }}"
                  data:
                    hs_color: >-
                      {{ [target_value, held_saturation] if rotation_mode == 'light_hue'
                         else [held_hue, target_value] }}
        - if: "{{ as_timestamp(now()) >= deadline }}"
          then:
            - stop: 최대 반복 시간 도달
        - delay:
            seconds: "{{ [repeat_interval_ms / 1000, [deadline - as_timestamp(now()), 0] | max] | min }}"
